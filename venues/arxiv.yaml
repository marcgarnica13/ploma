# Venue profile schema adapted from Hugo Sant'Anna's clo-author
# (github.com/hugosantanna/clo-author), used with permission.
key: arxiv
name: "arXiv preprint"
kind: preprint
doc_classes: [article, amsart, revtex4-2]
cite_style: numeric
page_budget: null
anonymized: false
bib_style_hint: null
focus: "A public preprint on arXiv. No formal peer review; readers judge the work directly, so clarity and honest framing of the claims matter most. The source must also compile on the arXiv build system."
bar: "Moderation checks that the submission is a scholarly article in the chosen category. The real bar is the reader: a clear abstract, a precise claim and a self-contained paper."
referee_pool: {EVALUATION: 0.20, METHODOLOGY: 0.20, REPRODUCIBILITY: 0.10, NOVELTY: 0.15, SKEPTIC: 0.10, CLARITY: 0.25}
domain_adjustments:
  fit: [10, 0]
  contribution: [30, 35]
methods_adjustments: {}
typical_concerns:
  - "Does the abstract state the claim and the evidence precisely?"
  - "Is the paper self-contained for a reader who will never see a cover letter or reviews?"
  - "Are the claims framed honestly for a work that has not been peer reviewed?"
  - "Will the source compile on arXiv as uploaded?"
peeves:
  critical:
    - "An abstract that promises more than the paper delivers."
    - "Comments, hidden text or private notes left in the uploaded source."
  constructive:
    - "Appreciates a link to code and data in the abstract or first page."
    - "Rewards a version note explaining what changed between arXiv versions."
format_rules:
  - "Upload source, not only a PDF; include the .bbl file because arXiv does not run BibTeX or Biber reliably."
  - "Strip comments from the source before upload; arXiv publishes the source."
  - "Keep the abstract in the metadata within 1920 characters and free of LaTeX macros."
submission_checks: [placeholders, undefined_refs, arxiv_rules]
