ploma: "0.1"
document:
  type: paper
  main: main.tex
  root: "."
  title: "A Method for Ranking Things"
  slug: main
  anonymized: false
build:
  command: "make"
  cwd: "."
  engine: pdflatex
  bib_tool: bibtex
  bib_files: [refs.bib]
  pdf: main.pdf
  log: main.log
  overfull_threshold_pt: 10
venue:
  profile: generic-conference
  doc_class: article
  page_budget: 8
  page_budget_includes_refs: false
  cite_style: numeric
reviews:
  glob: "review/*.md"
outputs:
  dir: quality_reports
pipeline:
  enabled: true
  language: python
  run_from: "."
  outputs_dir: results
  metric_keys: [avg_fitness, n_teams]
  tolerances: {counts: exact, metrics: 0.01, aggregates: 0.02, percentages_pp: 0.1}
